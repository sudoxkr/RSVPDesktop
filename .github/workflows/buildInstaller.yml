name: Build and publish Windows x64 installer

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build Windows 64-bit installer
        run: npm run dist

      - name: Upload installer as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: RSVPDesktop-windows-x64-installer
          path: release/*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish installer on GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: RSVP Desktop ${{ github.ref_name }}
          generate_release_notes: true
          files: release/*.exe
