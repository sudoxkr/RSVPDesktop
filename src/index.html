<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self';">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RSVP Desktop</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="card">
    <div class="icon" aria-hidden="true">♪</div>
    <p class="eyebrow">A LITTLE NUDGE, RIGHT ON TIME</p>
    <h1>Set a reminder</h1>
    <p class="intro">Choose when you want a gentle chime.</p>

    <form id="reminder-form">
      <label for="reminder-time">Remind me at</label>
      <input id="reminder-time" type="time" value="09:00" required>

      <label for="lead-minutes">Play the chime before</label>
      <div class="lead-row">
        <input id="lead-minutes" type="number" min="1" max="60" value="5" required>
        <span>minutes</span>
      </div>

      <section class="preferences" aria-labelledby="preferences-heading">
        <h2 id="preferences-heading">Window preferences</h2>
        <label for="opacity-slider" class="preference-label">
          <span>Window opacity</span>
          <output id="opacity-value" for="opacity-slider">100%</output>
        </label>
        <input id="opacity-slider" class="opacity-slider" type="range" min="50" max="100" value="100">
        <label for="flash-toggle" class="toggle-label">
          <span>Flash window when reminder goes off</span>
          <input id="flash-toggle" type="checkbox" checked>
        </label>
      </section>

      <div class="actions">
        <button id="set-button" type="submit">Set reminder</button>
        <button id="cancel-button" class="secondary" type="button" disabled>Cancel</button>
      </div>
    </form>

    <p id="status" class="status" role="status" aria-live="polite">Your reminder will run while the app is open.</p>
  </main>
  <script src="renderer.js"></script>
</body>
</html>
