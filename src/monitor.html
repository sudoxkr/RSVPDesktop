<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self';">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RSVP Desktop — Alarms</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="monitor-fit.css">
</head>
<body class="monitor-body">
  <main class="card monitor-card">
    <div class="monitor-drag-handle" aria-label="Drag to move the alarm window" title="Drag to move window">⠿ &nbsp; Drag to move</div>
    <section class="alarm-list-section" aria-labelledby="monitor-heading">
      <h2 id="monitor-heading">Alarm schedule</h2>
      <ul id="monitor-list" class="monitor-list" aria-live="polite"></ul>
      <p id="monitor-empty" class="empty-state">No alarms configured yet.</p>
    </section>
    <p id="monitor-updated" class="status">Updates automatically.</p>
  </main>
  <script src="monitor.js"></script>
  <script src="monitor-fit.js"></script>
</body>
</html>
